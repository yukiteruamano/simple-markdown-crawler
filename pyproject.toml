[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "simple-markdown-crawler"
version = "0.2.0"
authors = [
  { name="Jose Maldonado", email="josemald89@gmail.com" },
]
description = "A multithreaded 🕸️ web crawler that recursively crawls a website and creates a 🔽 markdown file for each page"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "beautifulsoup4>=4.15.0,<5",
    "markdownify>=1.2.3,<2",
    "requests>=2.34.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.2,<1",
]

[project.urls]
"Homepage" = "https://github.com/yukiteruamano/simple-markdown-crawler"
"Bug Tracker" = "https://github.com/yukiteruamano/simple-markdown-crawler/issues"
"Twitter" = "https://x.com/Yukiteru_Amano"

[project.scripts]
simple-markdown-crawler = "simple_markdown_crawler.cli:main"

[tool.setuptools]
packages = ["simple_markdown_crawler"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "C4", "SIM", "PERF", "PTH", "G", "T20", "RUF", "TRY", "RET", "PIE", "INT"]
ignore = ["D", "CPY001", "EM", "FBT", "TRY003", "T201", "S311"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
